spring:
  application:
    name: banking-backend
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:banking}}
    username: ${DB_USERNAME:banking}
    password: ${DB_PASSWORD:banking}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.bank.*"
        spring.json.value.default.type: com.bank.common.event.DomainEvent

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789-banking-system-hs256-key}
    issuer: banking-system
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  seed:
    admin:
      enabled: ${SEED_ADMIN:false}
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    demo:
      enabled: ${SEED_DEMO:false}
      email: ${DEMO_EMAIL:}
      password: ${DEMO_PASSWORD:}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  events:
    topic: ${EVENTS_TOPIC:banking.events}
    enabled: ${EVENTS_ENABLED:true}
  mail:
    from: ${MAIL_FROM:no-reply@bank.local}
  ratelimit:
    enabled: ${RATELIMIT_ENABLED:true}
    auth-per-minute: ${RATELIMIT_AUTH_PER_MINUTE:20}
