# Render Blueprint — backend Web Service only.
# Configure Neon/Postgres credentials in the Render dashboard.
# Frontend deploys separately on Vercel.

services:
  - type: web
    name: banking-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EVENTS_ENABLED
        value: "false"
      # Fail closed: neither administrator nor demo accounts are created on deploy.
      - key: SEED_ADMIN
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Set SEED_ADMIN=true only after supplying a unique, strong owner credential.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
