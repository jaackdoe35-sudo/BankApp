# Render Blueprint — backend Web Service only.
# Configure Neon/Postgres and Redis credentials in the Render dashboard.
# Frontend deploys separately on Vercel.

services:
  - type: web
    name: banking-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: EVENTS_ENABLED
        value: "false"
      # Fail closed: neither administrator nor demo accounts are created on deploy.
      - key: SEED_ADMIN
        value: "false"
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Set SEED_ADMIN=true only after supplying a unique, strong owner credential.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        sync: false
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Gmail API OAuth: secrets are entered in Render, never committed to the repository.
      - key: GMAIL_OAUTH_CLIENT_ID
        sync: false
      - key: GMAIL_OAUTH_CLIENT_SECRET
        sync: false
      - key: GMAIL_OAUTH_REDIRECT_URI
        value: https://banking-backend-nzjt.onrender.com/api/v1/admin/email/oauth/callback
      - key: GMAIL_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: MAIL_OUTBOX_POLL_INTERVAL_MS
        value: "30000"
