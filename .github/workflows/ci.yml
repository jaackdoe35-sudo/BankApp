name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the Docker daemon preinstalled on GitHub runners.
      - name: Build and test
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Upload updated frontend lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock
          path: frontend/package-lock.json
      - name: Build
        env:
          VITE_ACTIVITY_ALLOW_LOCAL_FALLBACK: 'true'
        run: npm run build
      - name: Install Playwright Chromium
        run: npx --yes --package=playwright@1.57.0 playwright install --with-deps chromium
      - name: Run browser end-to-end checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bankapp-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          npx --yes --package=playwright@1.57.0 -c 'node e2e/smoke.cjs'

  production-read-only-smoke:
    name: Production API (read-only acceptance)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Verify live health and ping
        env:
          BANKAPP_API_BASE_URL: https://banking-backend-nzjt.onrender.com
        run: |
          node --input-type=module <<'NODE'
          const base = process.env.BANKAPP_API_BASE_URL.replace(/\/$/, '')
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))

          async function request(path, expectedStatus, attempts = 1) {
            let lastError
            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              try {
                const response = await fetch(base + path, {
                  method: 'GET',
                  headers: { Accept: 'application/json', 'Cache-Control': 'no-cache' },
                  signal: AbortSignal.timeout(30000),
                })
                const raw = await response.text()
                let data = null
                try { data = raw ? JSON.parse(raw) : null } catch {}
                if (response.status !== expectedStatus) {
                  throw new Error(`${path}: expected HTTP ${expectedStatus}, received HTTP ${response.status}; response=${raw.slice(0, 300)}`)
                }
                return { response, data }
              } catch (error) {
                lastError = error
                if (attempt < attempts) await sleep(Math.min(attempt * 3000, 10000))
              }
            }
            throw lastError
          }

          const deadline = Date.now() + 6 * 60 * 1000
          let health
          let lastHealthError
          while (Date.now() < deadline) {
            try {
              health = await request('/actuator/health', 200)
              if (health.data?.status === 'UP') break
              throw new Error('Health endpoint did not return status=UP')
            } catch (error) {
              lastHealthError = error
              await sleep(10000)
            }
          }
          if (!health || health.data?.status !== 'UP') {
            throw new Error(`Backend health check failed: ${lastHealthError?.message || 'timeout'}`)
          }
          console.log('PASS: GET /actuator/health -> HTTP 200, status=UP')

          const ping = await request('/api/v1/ping', 200, 3)
          if (ping.data?.status !== 'UP' || ping.data?.service !== 'banking-backend') {
            throw new Error('Ping endpoint did not identify the banking backend as UP')
          }
          console.log('PASS: GET /api/v1/ping -> HTTP 200, status=UP')

          const protectedReads = [
            '/api/v1/users/me',
            '/api/v1/accounts',
            '/api/v1/notifications',
            '/api/v1/admin/accounts',
            '/api/v1/admin/users',
            '/api/v1/admin/experiments/events',
          ]
          for (const path of protectedReads) {
            await request(path, 401, 2)
            console.log(`PASS: GET ${path} -> HTTP 401 without credentials`)
          }

          console.log(JSON.stringify({
            result: 'PASS',
            checkType: 'production-read-only',
            methodsUsed: ['GET'],
            health: 'UP',
            ping: 'UP',
            unauthenticatedCustomerAndAdminRoutes: protectedReads.length,
            mutationsPerformed: 0,
          }, null, 2))
          NODE
