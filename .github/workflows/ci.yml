name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Maven verify)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Testcontainers uses the Docker daemon preinstalled on GitHub runners.
      - name: Build and test
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx --yes --package=playwright@1.57.0 playwright install --with-deps chromium
      - name: Run browser end-to-end checks
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bankapp-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
          npx --yes --package=playwright@1.57.0 -c 'node e2e/smoke.cjs'
