name: Final frontend lockfile refresh

on:
  push:
    branches:
      - remove-kyc-disable-withdrawals
    paths:
      - '.github/workflows/refresh-frontend-lockfile-final.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: remove-kyc-disable-withdrawals
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Regenerate lockfile with CI npm
        working-directory: frontend
        run: |
          test "$(node --version)" = "v22.23.4"
          test "$(npm --version)" = "10.9.9"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit and push synchronized lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: synchronize frontend npm lockfile"
          git fetch origin remove-kyc-disable-withdrawals
          git rebase origin/remove-kyc-disable-withdrawals
          git push origin HEAD:remove-kyc-disable-withdrawals
