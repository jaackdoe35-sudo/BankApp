name: One-time frontend lockfile refresh

on:
  push:
    branches:
      - remove-kyc-disable-withdrawals
    paths:
      - '.github/workflows/refresh-frontend-lockfile.yml'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: remove-kyc-disable-withdrawals
          fetch-depth: 0
      - name: Set up the CI Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - name: Pin the CI npm version
        run: |
          npm install --global npm@10.9.9
          test "$(node --version)" = "v22.23.4"
          test "$(npm --version)" = "10.9.9"
      - name: Regenerate lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- frontend/package-lock.json; then
            echo "Lockfile already synchronized; no commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "chore: synchronize frontend npm lockfile"
          git push origin HEAD:remove-kyc-disable-withdrawals
